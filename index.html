<script>
// ===== セゾン明細パーサー（pdf.js の getTextContent 結果 → 明細データ）=====
// 画面の外でも動くよう素のJSで書いている（Nodeで実PDFを使ったテスト済み）
function cardPdfRows(pages){
  const out=[];
  for(const pg of pages){
    const rows=[];
    for(const it of pg.items){
      if(!it.str||!it.str.trim()) continue;
      const x=it.transform[4], y=it.transform[5];
      let r=rows.find(r=>Math.abs(r.y-y)<2.5);
      if(!r){ r={y,cells:[]}; rows.push(r); }
      r.cells.push({x,s:it.str.trim()});
    }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){ r.cells.sort((a,b)=>a.x-b.x); out.push(r.cells.map(c=>c.s)); }
  }
  return out;
}
const cardNum=s=>parseInt(String(s).replace(/[\s,円]/g,''),10);
// 表示名の元になるキー：QP/（QUICPay）を外し、空白を1つに揃える
function cardCleanMerchant(raw){ return raw.replace(/\s+/g,' ').replace(/^QP\//,'').trim(); }
function cardHolderOf(name){
  if(/モモエ|萌々恵|ももえ/.test(name)) return 'momoe';
  if(/敏徳|トシノリ|としのり/.test(name)) return 'toshi';
  return null;
}
function cardParseStatement(pages){
  const rows=cardPdfRows(pages);
  const res={total:null,billing_date:null,subtotal:{},txs:[],errors:[],warnings:[]};
  let who=null, last=null, done=false;
  for(const cells of rows){
    const line=cells.join(' ');
    const flat=line.replace(/\s/g,'');
    if(res.total==null && /^ご請求金額/.test(flat)){
      const m=flat.match(/ご請求金額(-?[\d,]+)円/); if(m) res.total=cardNum(m[1]); continue;
    }
    if(!res.billing_date && /^お支払日/.test(flat)){
      const m=flat.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if(m) res.billing_date=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`; continue;
    }
    if(done) continue;
    const um=flat.match(/^ご利用者名[:：](.+?)様/);
    if(um){ who=cardHolderOf(um[1]); if(!who) res.errors.push(`利用者名を判別できません：${um[1]}`); last=null; continue; }
    if(!who) continue;
    // 家族カードの小計行は「【小計】 1 426976」のように家族印が混ざるので最後のセルを金額とする
    if(/^【小計】/.test(flat)){ res.subtotal[who]=cardNum(cells[cells.length-1]); last=null; continue; }
    if(/^【合計】/.test(flat)){ last=null; continue; }
    if(/^\d+\/\d+$/.test(flat)||/^ご利用明細$|^ご利用$|^年月日|^ご利用店名|^「/.test(flat)) continue;
    // 取引行：先頭が「数字とスペースで8桁」の日付
    const d=cells[0].replace(/\s/g,'');
    if(/^\d{8}$/.test(d) && cells.length>=3){
      const iPay=cells.findIndex((c,i)=>i>0 && /^\d*回$|^リボ|^分割|^ボーナス/.test(c.replace(/\s/g,'')));
      if(iPay<0 || iPay+1>=cells.length){ res.errors.push(`読めない行：${line}`); continue; }
      let mCells=cells.slice(1,iPay);
      let family=false;
      if(mCells.length>1 && mCells[mCells.length-1]==='1'){ family=true; mCells=mCells.slice(0,-1); }
      if(cells[iPay].replace(/\s/g,'')!=='1回') res.warnings.push(`1回払い以外の行：${line}`);
      const amount=cardNum(cells[iPay+1]);
      if(isNaN(amount)){ res.errors.push(`金額が読めない行：${line}`); continue; }
      const raw=mCells.join(' ');
      const note=cells.slice(iPay+2).join(' ');
      if(family && who!=='momoe') res.warnings.push(`家族カード印があるのに本会員の欄：${line}`);
      last={used_on:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`, merchant_raw:raw, name_key:cardCleanMerchant(raw),
            amount, cardholder:who, foreign_note: note||null};
      res.txs.push(last); continue;
    }
    // 外貨の続き行（例：「(SINGAPORE) 円換算レート:8/23 165.1200」）
    if(last && last.foreign_note!=null){ last.foreign_note=(last.foreign_note+' '+line).trim(); continue; }
    if(/規約|第\d+条/.test(flat)){ done=true; continue; }
  }
  for(const t of res.txs){
    if(!t.foreign_note) continue;
    const a=t.foreign_note.match(/現地通貨額[:：]\s*([\d.,]+)\s*([A-Z]{3})/);
    const r=t.foreign_note.match(/円換算レート[:：]\s*(\d+\/\d+)\s*([\d.]+)/);
    if(a) t.foreign_note=`${a[1]} ${a[2]}`+(r?` / ${r[1]} ${Number(r[2])}円`:'');
  }
  // 検算：利用者ごとの合計＝【小計】、総額＝ご請求金額
  if(res.total==null) res.errors.push('ご請求金額が見つかりません');
  if(!res.billing_date) res.errors.push('お支払日が見つかりません');
  const sums={};
  for(const t of res.txs) sums[t.cardholder]=(sums[t.cardholder]||0)+t.amount;
  res.sums=sums;
  const nm=k=>k==='toshi'?'敏徳':'萌々恵';
  for(const k of new Set([...Object.keys(sums),...Object.keys(res.subtotal)])){
    if(res.subtotal[k]==null) res.errors.push(`${nm(k)}の【小計】が見つかりません`);
    else if(res.subtotal[k]!==(sums[k]||0)) res.errors.push(`${nm(k)}：明細の合計 ${(sums[k]||0).toLocaleString()}円 ≠ 小計 ${res.subtotal[k].toLocaleString()}円（差 ${((sums[k]||0)-res.subtotal[k]).toLocaleString()}円）`);
  }
  const all=Object.values(sums).reduce((a,b)=>a+b,0);
  if(res.total!=null && all!==res.total) res.errors.push(`明細の総額 ${all.toLocaleString()}円 ≠ ご請求金額 ${res.total.toLocaleString()}円（差 ${(all-res.total).toLocaleString()}円）`);
  if(!res.txs.length) res.errors.push('利用明細の行が1件も見つかりません（セゾンの明細PDFか確認してください）');
  res.ok=res.errors.length===0;
  return res;
}
</script>

const yen = n => (n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString("ja-JP") + "円";
const signedYen = n => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(Math.round(n)).toLocaleString("ja-JP") + "円";
const md = d => { const [, m, dd] = d.split("-"); return `${+m}/${+dd}`; };
const monthLabel = bd => { const [y, m] = bd.split("-"); return `${y}年${+m}月引落し`; };
const shortMonth = bd => `${+bd.split("-")[1]}月`;
const ratioOf = t => (t.split_ratio != null ? +t.split_ratio : 0.5);
// 会社の仕事分（経費＋按分の事業分）と、会社に精算が必要な分（私用＋按分の私用分）
const bizAmount = t => t.judgment === "expense" ? t.amount : t.judgment === "split" ? t.amount * ratioOf(t) : 0;
const privAmount = t => t.judgment === "private" ? t.amount : t.judgment === "split" ? t.amount * (1 - ratioOf(t)) : 0;
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);

// 店名 → 表示名・カテゴリ・判定
function makeClassifier(rules, names) {
  const sorted = [...rules].sort((a, b) => a.priority - b.priority || a.id - b.id);
  const nameMap = Object.fromEntries(names.map(n => [n.name_key, n.display]));
  return t => {
    const display = nameMap[t.name_key] || t.name_key;
    const hit = sorted.find(r => t.merchant_raw.includes(r.pattern) || display.includes(r.pattern));
    const category = hit ? hit.category : "その他・不明";
    const ruleJ = hit && (t.cardholder === "toshi" ? hit.judgment_toshi : hit.judgment_momoe);
    const judgment = ruleJ || defaultJudgment(category, t.cardholder);
    return { merchant: display, category, judgment, split_ratio: judgment === "split" ? 0.5 : null };
  };
}

function buildInsights(statements, txs, stmt, me) {
  const idx = statements.findIndex(s => s.id === stmt.id);
  const prev = statements[idx + 1];
  const older = statements.slice(idx + 1).map(s => s.id);
  const cur = txs.filter(t => t.statement_id === stmt.id);
  const out = [];
  if (prev) {
    const d = stmt.total - prev.total;
    out.push({ k: "total", t: <>請求額は先月より <b className={d > 0 ? "up" : "dn"}>{signedYen(d)}</b>（{yen(prev.total)} → {yen(stmt.total)}）</> });
    const prevT = txs.filter(t => t.statement_id === prev.id);
    const catDiff = CATEGORIES.map(c => ({ c, d: sum(cur.filter(t => t.category === c), t => t.amount) - sum(prevT.filter(t => t.category === c), t => t.amount) }))
      .filter(x => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 2);
    if (catDiff.length) out.push({ k: "cat", t: <>先月から増えたのは {catDiff.map((x, i) => <span key={x.c}>{i ? "、" : ""}<b>{x.c}</b>（<span className="up">{signedYen(x.d)}</span>）</span>)}</> });
    const seen = new Set(txs.filter(t => older.includes(t.statement_id)).map(t => t.merchant));
    const fresh = [...new Set(cur.filter(t => SUBSCRIPTION_CATS.includes(t.category) && !seen.has(t.merchant)).map(t => t.merchant))];
    if (fresh.length) out.push({ k: "new", t: <>初めて出てきた支払い（毎月続くかも）：<b>{fresh.join("、")}</b></> });
    const dc = sum(cur.filter(t => t.category === "キャリア決済（ドコモ）"), t => t.amount), dp = sum(prevT.filter(t => t.category === "キャリア決済（ドコモ）"), t => t.amount);
    if (dc) out.push({ k: "docomo", t: <>ドコモのキャリア決済（d払い等）は <b>{yen(dc)}</b>（先月から <span className={dc - dp > 0 ? "up" : "dn"}>{signedYen(dc - dp)}</span>）。中身はdアカウントの明細で確認を</> });
  }
  const byM = {};
  for (const t of cur.filter(t => SUBSCRIPTION_CATS.includes(t.category))) (byM[t.merchant + "|" + t.cardholder] = byM[t.merchant + "|" + t.cardholder] || []).push(t);
  for (const [k, list] of Object.entries(byM)) if (list.length >= 2)
    out.push({ k: "dup" + k, warn: true, t: <><b>{list[0].merchant}</b> が同じ月に{list.length}回請求されています（{list.map(t => yen(t.amount)).join("・")}）。二重になっていないか確認を</> });
  const chk = cur.filter(t => t.judgment === "check" && (me.role === "owner" || t.cardholder === me.cardholder));
  if (chk.length) out.push({ k: "chk", t: <>この月の要確認は <b>{chk.length}件</b>（{yen(sum(chk, t => t.amount))}）残っています</> });
  return out;
}

function Home({ me, statements, txs, stmtId, setStmtId, go }) {

  const idx = statements.findIndex(s => s.id === stmt.id), prev = statements[idx + 1];
  const cur = txs.filter(t => t.statement_id === stmt.id);
  const cats = CATEGORIES.map(c => {
    const l = cur.filter(t => t.category === c);
    return { c, toshi: sum(l.filter(t => t.cardholder === "toshi"), t => t.amount), momoe: sum(l.filter(t => t.cardholder === "momoe"), t => t.amount), list: l };
  }).map(x => ({ ...x, total: x.toshi + x.momoe })).filter(x => x.list.length).sort((a, b) => b.total - a.total);
  const max = Math.max(...cats.map(c => c.total), 1);
  const pT = stmt.total ? stmt.subtotal_toshi / stmt.total * 100 : 0;
  const insights = buildInsights(statements, txs, stmt, me);
  const myChecks = txs.filter(t => t.cardholder === me.cardholder && t.judgment === "check" && !t.question).length;
  const questions = txs.filter(t => t.question).length;
  const biz = sum(cur, bizAmount), priv = sum(cur, privAmount), chk = sum(cur.filter(t => t.judgment === "check"), t => t.amount);

  return (
    <>
      {(myChecks > 0 || (me.role === "owner" && questions > 0)) && <div className="card action" onClick={() => go("check")}>
        {me.role === "owner" && questions > 0 && <div><b>萌々恵から質問 {questions}件</b> <span className="sub">— 答えてあげてください</span></div>}
        {myChecks > 0 && <div><b>{me.role === "owner" ? "自分の" : "あなたの"}要確認 {myChecks}件</b> <span className="sub">— 「仕事／私用」を選ぶだけ</span></div>}
        <div className="go">チェックする →</div>
      </div>}

        <MonthSelect statements={statements} stmtId={stmtId} setStmtId={setStmtId} />
        <div className="tiles" style={{ marginTop: 10 }}>
          <div className="tile"><div className="l">ご請求額</div><div className="v">{yen(stmt.total)}</div>
            {prev && <div className="s">先月より <span className={stmt.total > prev.total ? "up" : "dn"}>{signedYen(stmt.total - prev.total)}</span></div>}</div>
          <div className="tile"><div className="l"><span className="sw" style={{ background: HOLDERS.toshi.color }}></span>敏徳</div><div className="v">{yen(stmt.subtotal_toshi)}</div><div className="s">{Math.round(pT)}%</div></div>
          <div className="tile"><div className="l"><span className="sw" style={{ background: HOLDERS.momoe.color }}></span>萌々恵</div><div className="v">{yen(stmt.subtotal_momoe)}</div><div className="s">{Math.round(100 - pT)}%</div></div>
        </div>
        <div className="split"><span style={{ width: pT + "%", background: HOLDERS.toshi.color }}></span><span style={{ width: (100 - pT) + "%", background: HOLDERS.momoe.color }}></span></div>
      </div>

      {insights.length > 0 && <div className="card"><h2>今月のひとこと</h2>
        <ul className="pts">{insights.map(x => <li key={x.k} className={x.warn ? "warnli" : ""}>{x.t}</li>)}</ul></div>}

      <div className="card">
        <h2>経費の内訳（目安）</h2>
        <div className="mini4">
          <div><div className="l"><span className="jb j-expense">経費</span></div><div className="v">{yen(biz)}</div><div className="s">按分の事業分を含む</div></div>
          <div><div className="l"><span className="jb j-private">私用</span></div><div className="v">{yen(priv)}</div><div className="s">会社に精算が必要</div></div>
          <div><div className="l"><span className="jb j-check">⚠ 要確認</span></div><div className="v">{yen(chk)}</div><div className="s">{cur.filter(t => t.judgment === "check").length}件</div></div>
        </div>
      </div>

      <div className="card">
        <h2>何に使った？</h2>
        <div className="legend"><Who h="toshi" /><Who h="momoe" /><span className="small">タップで内訳</span></div>
        {cats.map(c => <div key={c.c}>
          <div className={"catrow" + (openCat === c.c ? " sel" : "")} onClick={() => setOpenCat(openCat === c.c ? null : c.c)}>
            <div className="n">{c.c}</div>
            <div className="bar2">
              {c.toshi > 0 && <span style={{ width: (c.toshi / max * 100) + "%", background: HOLDERS.toshi.color }}></span>}
              {c.momoe > 0 && <span style={{ width: (c.momoe / max * 100) + "%", background: HOLDERS.momoe.color }}></span>}
            </div>
            <div className="a">{yen(c.total)}</div>
          </div>
          {openCat === c.c && <div className="catdetail">
            <div className="sub">敏徳 {yen(c.toshi)} ・ 萌々恵 {yen(c.momoe)} ・ {c.list.length}件</div>
            <table><tbody>{Object.entries(c.list.reduce((m, t) => { const k = t.merchant; (m[k] = m[k] || { n: 0, a: 0, h: new Set() }); m[k].n++; m[k].a += t.amount; m[k].h.add(t.cardholder); return m; }, {}))
              .sort((a, b) => b[1].a - a[1].a).slice(0, 6).map(([m, v]) => <tr key={m}>
                <td>{[...v.h].map(h => <span key={h} className="sw" style={{ background: HOLDERS[h].color, marginRight: 4 }}></span>)}{m}{v.n > 1 && <span className="small"> ×{v.n}</span>}</td>
                <td className="r">{yen(v.a)}</td></tr>)}</tbody></table>

}

// ---------- メモ入力の手間を減らす（定型・過去のメモ・探索記録） ----------
const CardCtx = React.createContext({ txs: [], work: {}, receipts: [], setReceipts: () => {}, me: null });
const MEMO_TEMPLATES = {
  "外食": ["打ち合わせ（相手：　／人数：　名）", "お客様と会食（相手：　／人数：　名）", "物件調査の途中の食事"],
  "_": ["物件調査（空き家・現地確認）", "お客様と打ち合わせ", "業者・取引先と打ち合わせ", "役所・法務局で調査", "事務所の備品", "物件の修繕・清掃用", "仕事の移動"],
};
// 探索記録の地点 → 市区町村名（国土地理院。端末に覚えておく）
let gsiMuniPromise = null;
function loadGsiMuni() {
  if (!gsiMuniPromise) gsiMuniPromise = new Promise(res => {
    window.GSI = window.GSI || {};
    const sc = document.createElement("script");
    sc.src = "https://maps.gsi.go.jp/js/muni.js";
    sc.onload = () => res(window.GSI.MUNI_ARRAY || {}); sc.onerror = () => res({});
    document.head.appendChild(sc);
  });
  return gsiMuniPromise;
}
function usePlace(w) {
  const key = w ? "card-place:" + w.day : null;
  const [place, setPlace] = useState(() => { try { return key && localStorage.getItem(key); } catch { return null; } });
  useEffect(() => {
    if (!w || place) return;
    let alive = true;
    (async () => {
      try {
        const r = await (await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${w.lat}&lon=${w.lng}`)).json();
        const cd = r && r.results && r.results.muniCd;
        const row = cd && (await loadGsiMuni())[String(+cd)];
        const name = row ? row.split(",")[3].replace(/\s/g, "") : "";
        if (name && alive) { setPlace(name); try { localStorage.setItem(key, name); } catch {} }
      } catch {}
    })();
    return () => { alive = false; };
  }, [key]);
  return place;
}
const workOf = (work, t) => t && t.cardholder === "toshi" ? work[t.used_on] : null;
function workMemo(w, place) { return `${place || ""}${place ? "で" : ""}物件調査（地上げ探索の記録あり）`; }
function WorkBanner({ t, onApply, busy }) {
  const { work } = React.useContext(CardCtx);
  const w = workOf(work, t);
  const place = usePlace(w);
  if (!w) return null;
  const h = w.minutes >= 60 ? `約${Math.round(w.minutes / 60)}時間` : `${w.minutes}分`;
  return <div className="workbar"><div>📍 この日は<b>{place || "…"}</b>で地上げ探索の記録があります（{h}）</div>
    {onApply && <button className="b-work" disabled={busy} onClick={() => onApply(workMemo(w, place))}>「{workMemo(w, place)}」で経費にする</button>}
  </div>;
}
function MemoHelper({ t, memo, setMemo }) {
  const { txs, work } = React.useContext(CardCtx);
  const w = workOf(work, t);
  const place = usePlace(w);
  const past = [...new Set(txs.filter(x => x.id !== t.id && x.purpose_memo && x.cardholder === t.cardholder && x.merchant === t.merchant)
    .sort((a, b) => b.used_on.localeCompare(a.used_on)).map(x => x.purpose_memo))].slice(0, 3);
  const recent = [...new Set(txs.filter(x => x.id !== t.id && x.purpose_memo && x.cardholder === t.cardholder)
    .sort((a, b) => (b.updated_at || "").localeCompare(a.updated_at || "")).map(x => x.purpose_memo))].filter(m => !past.includes(m)).slice(0, 3);
  const tmpl = MEMO_TEMPLATES[t.category] || MEMO_TEMPLATES._;
  const chips = [...(w ? [workMemo(w, place)] : []), ...past.map(m => "🕘 " + m), ...recent.map(m => "🕘 " + m), ...tmpl];
  const pick = c => { const v = c.replace(/^🕘 /, ""); setMemo(memo && !memo.includes(v) ? memo + "／" + v : v); };
  return <div className="memochips">
    {chips.map((c, i) => <button key={i} type="button" className="mchip" onClick={() => pick(c)}>{c}</button>)}
    <div className="small" style={{ width: "100%" }}>タップで入ります（🕘＝前に使ったメモ）。キーボードのマイクで話して入力してもOK。</div>
  </div>;
}

// ---------- 経費チェック（1件ずつ） ----------
function CheckCard({ t, mode, onDecide, onSkip }) {
  const [step, setStep] = useState("choose"), [memo, setMemo] = useState(t.purpose_memo || ""), [busy, setBusy] = useState(false), [err, setErr] = useState("");
  useEffect(() => { setStep("choose"); setMemo(t.purpose_memo || ""); setErr(""); }, [t.id]);
  const needMemo = t.category === "外食";
  const decide = async patch => { setBusy(true); setErr(""); const e = await onDecide(t, patch); setBusy(false); if (e) setErr(e); };
  return (
    <div className="card bigcard">
      <div className="top"><Who h={t.cardholder} /><span className="small">{t.used_on.replace(/-/g, "/")}</span></div>
      <div className="bm">{t.merchant}</div>
      <div className="ba num">{yen(t.amount)}</div>
      <div className="meta"><span className="chip">{t.category}</span>{t.foreign_note && <span className="small">{t.foreign_note}</span>}</div>
      <div className="explain">💡 {explain(t.category)}</div>
      <WorkBanner t={t} busy={busy} onApply={step === "choose" ? m => decide({ judgment: "expense", purpose_memo: m, question: false }) : null} />
      {t.question && <div className="flag">萌々恵さんから「わからない」と質問が来ています{t.purpose_memo ? `（メモ：${t.purpose_memo}）` : ""}</div>}
      {step === "choose" ? <div className="bigbtns">
        <button className="b-work" disabled={busy} onClick={() => setStep("memo")}>💼 仕事で使った</button>
        <button className="b-priv" disabled={busy} onClick={() => decide({ judgment: "private", question: false })}>🏠 私用</button>
        {mode === "owner"
          ? <><button className="b-split" disabled={busy} onClick={() => decide({ judgment: "split", split_ratio: 0.5, question: false })}>½ 一部だけ仕事（按分50%）</button>
              <button className="b-ask" disabled={busy} onClick={onSkip}>あとで</button></>
          : <button className="b-ask" disabled={busy} onClick={() => decide({ question: true })}>🤔 わからない（としに聞く）</button>}
      </div> : <div>
        <div className="field"><label>何のため？（誰と・どこへ）{needMemo ? "　※外食は必ず書いてください" : ""}</label>
          <textarea rows="2" value={memo} onChange={e => setMemo(e.target.value)} placeholder="例：〇〇さんと打ち合わせ／△△の物件を見に行った" />
          <MemoHelper t={t} memo={memo} setMemo={setMemo} /></div>
        <div className="bigbtns">
          <button className="b-work" disabled={busy || (needMemo && !memo.trim())} onClick={() => decide({ judgment: "expense", purpose_memo: memo.trim() || null, question: false })}>{busy ? "保存中…" : "これで決定"}</button>

        </div>
      </div>}

function CheckFlow({ me, items, allMine, mode, updateTx, title, note }) {
  const [skipped, setSkipped] = useState([]);
  const queue = [...items.filter(t => !skipped.includes(t.id)), ...items.filter(t => skipped.includes(t.id))];
  const cur = queue[0];
  const done = allMine - items.length;
  const pct = allMine ? done / allMine * 100 : 100;
  return (
    <>
      <div className="card">
        <div className="top"><h2 style={{ margin: 0 }}>{title}</h2><span className="sub">残り <b className="num">{items.length}</b>件</span></div>
        <div className="progress"><span style={{ width: pct + "%" }}></span></div>
        {note && <div className="small" style={{ marginTop: 6 }}>{note}</div>}
      </div>
      {cur ? <CheckCard key={cur.id} t={cur} mode={mode}
        onDecide={async (t, patch) => updateTx(t.id, patch)}
        onSkip={() => setSkipped(s => [...s.filter(x => x !== cur.id), cur.id])} />
        : <div className="card done">🎉 全部チェックできました！<div className="sub">新しい明細が入ったら、またここに出てきます。</div></div>}
    </>
  );
}

function Check({ me, txs, updateTx }) {
  const mineAll = txs.filter(t => t.cardholder === me.cardholder);
  const order = (a, b) => b.statement_id - a.statement_id || a.used_on.localeCompare(b.used_on) || a.id - b.id;
  const mine = mineAll.filter(t => t.judgment === "check" && !t.question).sort(order);
  const everMine = mineAll.filter(t => t.judgment === "check" || t.judgment_source === "manual" || t.question).length;
  if (me.role === "owner") {
    const qs = txs.filter(t => t.question).sort(order);
    return <>
      {qs.length > 0 && <CheckFlow me={me} items={qs} allMine={qs.length} mode="owner" updateTx={updateTx} title={`萌々恵から質問（${qs.length}件）`} />}
      <CheckFlow me={me} items={mine} allMine={everMine} mode="owner" updateTx={updateTx} title="自分の要確認" />
      <Disclaimer />
    </>;
  }
  const asked = mineAll.filter(t => t.question).length;
  return <>
    <CheckFlow me={me} items={mine} allMine={everMine} mode="member" updateTx={updateTx} title="経費チェック"
      note="仕事で使ったか分からないものだけ出てきます。迷ったら「わからない」でOK。" />
    {asked > 0 && <div className="card sub">としに質問中：{asked}件（答えが出るとここから消えます）</div>}
    <Disclaimer />
  </>;
}

function EditSheet({ me, tx, txs, rules, reloadRules, updateTx, onClose }) {
  const isOwner = me.role === "owner";
  const canEdit = isOwner || tx.cardholder === me.cardholder;
  const [category, setCategory] = useState(tx.category);
  const [judgment, setJudgment] = useState(tx.judgment);

  const [memo, setMemo] = useState(tx.purpose_memo || "");
  const [learn, setLearn] = useState(true), [applyOthers, setApplyOthers] = useState(true);
  const [busy, setBusy] = useState(false), [err, setErr] = useState("");
  const catChanged = category !== tx.category;
  const others = txs.filter(t => t.id !== tx.id && t.merchant === tx.merchant && t.category !== category);
  const pickCategory = c => {
    setCategory(c);
    // 判定を手で触っていなければ、新しいカテゴリの既定の判定に合わせる
    if (tx.judgment_source === "auto" && judgment === tx.judgment) setJudgment(defaultJudgment(c, tx.cardholder));
  };
  const save = async () => {
    setBusy(true); setErr("");
    const patch = { judgment, split_ratio: judgment === "split" ? Math.min(100, Math.max(0, +ratio)) / 100 : null, purpose_memo: memo.trim() || null };
    if (judgment !== "check") patch.question = false;
    if (isOwner) {
      patch.category = category;
      const autoFollow = tx.judgment_source === "auto" && judgment === defaultJudgment(category, tx.cardholder);
      if (!autoFollow && (judgment !== tx.judgment || patch.split_ratio !== (tx.split_ratio == null ? null : +tx.split_ratio))) patch.judgment_source = "manual";
    }
    let e = await updateTx(tx.id, patch);
    if (!e && isOwner && catChanged && learn) {
      const minP = Math.min(0, ...rules.map(r => r.priority));
      const { error } = await sb.from("card_merchant_rules").upsert({ pattern: tx.merchant, category, priority: minP - 1 }, { onConflict: "pattern" });
      if (error) e = "ルールの保存に失敗：" + error.message; else reloadRules();
    }
    if (!e && isOwner && catChanged && applyOthers) {
      for (const t of others) {
        const p = { category };
        if (t.judgment_source === "auto") { p.judgment = defaultJudgment(category, t.cardholder); p.split_ratio = p.judgment === "split" ? 0.5 : null; }
        const er = await updateTx(t.id, p); if (er) { e = er; break; }
      }
    }
    setBusy(false);
    if (e) setErr(e); else onClose();
  };
  return (
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="top"><Who h={tx.cardholder} /><button className="link" onClick={onClose}>閉じる</button></div>
        <div style={{ fontSize: 18, fontWeight: 700, marginTop: 4 }}>{tx.merchant}</div>
        <div className="num" style={{ fontSize: 22, fontWeight: 700 }}>{yen(tx.amount)}</div>
        <div className="small">{tx.used_on.replace(/-/g, "/")} ・ 明細の表記：{tx.merchant_raw}{tx.foreign_note ? ` ・ ${tx.foreign_note}` : ""}</div>

        <div className="field"><label>カテゴリ</label>
          {isOwner ? <select value={category} onChange={e => pickCategory(e.target.value)} style={{ width: "100%" }}>
            {CATEGORY_GROUPS.map(([g, cs]) => <optgroup key={g} label={g}>{cs.map(c => <option key={c}>{c}</option>)}</optgroup>)}
          </select> : <div>{tx.category}</div>}
          {isOwner && catChanged && <div className="learn">
            <label><input type="checkbox" checked={learn} onChange={e => setLearn(e.target.checked)} /> 次からも「{tx.merchant}」は「{category}」にする</label>
            {others.length > 0 && <label><input type="checkbox" checked={applyOthers} onChange={e => setApplyOthers(e.target.checked)} /> 同じ店のほかの明細（{others.length}件）も変える</label>}
          </div>}
        </div>
        <div className="explain">💡 {explain(category)}</div>
        <WorkBanner t={tx} onApply={canEdit ? m => { setJudgment("expense"); setMemo(m); } : null} />

        <div className="field"><label>経費になる？</label>
          {canEdit ? <div className="seg">
            {Object.entries(JUDGMENTS).map(([k, v]) =>
              <button key={k} className={"j-" + k + (judgment === k ? " on" : "")} onClick={() => setJudgment(k)}>{v.label}</button>)}
          </div> : <Judge j={tx.judgment} q={tx.question} />}
          {tx.judgment_source === "manual" && <div className="small" style={{ marginTop: 4 }}>手で入力した判定です</div>}
          {tx.question && <div className="small" style={{ marginTop: 4 }}>❓ 萌々恵さんから質問中</div>}
        </div>
        {canEdit && judgment === "split" && <div className="field"><label>仕事で使った割合（%）</label>
          <input type="number" inputMode="numeric" min="0" max="100" value={ratio} onChange={e => setRatio(e.target.value)} style={{ width: 120 }} /></div>}

        <div className="field"><label>用途メモ（誰と・何のため）</label>
          {canEdit ? <><textarea rows="2" value={memo} onChange={e => setMemo(e.target.value)} placeholder="例：〇〇さんと打ち合わせ／△△の物件を見に行った" />
            <MemoHelper t={tx} memo={memo} setMemo={setMemo} /></>
            : <div>{tx.purpose_memo || <span className="small">なし</span>}</div>}
        </div>
        <TxReceipts tx={tx} canEdit={canEdit} />
        {!canEdit && <div className="flag">これは{HOLDERS[tx.cardholder].name}さんの利用分なので、見るだけです。</div>}
        {err && <div className="ngbox">{err}</div>}
        {canEdit && <button className="primary" style={{ width: "100%", marginTop: 16 }} onClick={save} disabled={busy}>{busy ? "保存中…" : "保存する"}</button>}
      </div>
    </div>
  );
}

// ---------- 分析（推移・固定費・経費まとめ） ----------
function findFixed(statements, txs) {
  const asc = [...statements].reverse();
  const pos = Object.fromEntries(asc.map((s, i) => [s.id, i]));
  const groups = {};
  for (const t of txs) if (FIXED_CATS.includes(t.category)) (groups[t.merchant + "|" + t.cardholder] = groups[t.merchant + "|" + t.cardholder] || []).push(t);
  const out = [];
  for (const list of Object.values(groups)) {
    const used = new Set();
    for (const a of [...list].sort((x, y) => pos[y.statement_id] - pos[x.statement_id])) {
      if (used.has(a.id) || a.amount <= 0) continue;
      const near = list.filter(t => !used.has(t.id) && Math.abs(t.amount - a.amount) <= a.amount * 0.05);
      const months = new Set(near.map(t => t.statement_id));
      if (months.size >= 2) {
        near.forEach(t => used.add(t.id));
        out.push({ merchant: a.merchant, cardholder: a.cardholder, category: a.category, amount: a.amount, months: months.size,
          last: asc[Math.max(...near.map(t => pos[t.statement_id]))].billing_date });
      }
    }
  }
  return out.sort((a, b) => b.amount - a.amount);
}

function Summary({ me, statements, txs }) {
  const [csvMonth, setCsvMonth] = useState("all");
  const rows = statements.map(s => {
    const l = txs.filter(t => t.statement_id === s.id);
    return { s, exp: sum(l.filter(t => t.judgment === "expense"), t => t.amount), splitBiz: sum(l.filter(t => t.judgment === "split"), bizAmount),
      priv: sum(l, privAmount), chk: sum(l.filter(t => t.judgment === "check"), t => t.amount), chkN: l.filter(t => t.judgment === "check").length };
  });
  const download = () => {
    const list = txs.filter(t => csvMonth === "all" || t.statement_id === +csvMonth)
      .sort((a, b) => a.statement_id - b.statement_id || a.used_on.localeCompare(b.used_on) || a.id - b.id);
    const bd = Object.fromEntries(statements.map(s => [s.id, s.billing_date]));
    const esc = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ["引落日", "利用日", "利用者", "店名", "金額", "カテゴリ", "判定", "事業割合", "事業分の金額", "会社に精算が必要な額", "用途メモ", "明細の表記", "外貨"];
    const lines = [head, ...list.map(t => [bd[t.statement_id], t.used_on, HOLDERS[t.cardholder].name, t.merchant, t.amount, t.category,
      t.question ? "要確認（質問中）" : JUDGMENTS[t.judgment].short, t.judgment === "split" ? ratioOf(t) : "", Math.round(bizAmount(t)), Math.round(privAmount(t)),
      t.purpose_memo, t.merchant_raw, t.foreign_note])].map(r => r.map(esc).join(",")).join("\r\n");

async function readPdf(file) {
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) pages.push(await (await doc.getPage(p)).getTextContent());
  return cardParseStatement(pages);
}

function Upload({ statements, onSaved, rules, names }) {
  const [items, setItems] = useState([]);
  const cls = useMemo(() => makeClassifier(rules, names), [rules, names]);
  const pick = async e => {
    const files = [...e.target.files]; e.target.value = "";
    const list = files.map(f => ({ key: f.name + f.size + Math.random(), name: f.name, state: "reading" }));
    setItems(list);
    for (let i = 0; i < list.length; i++) {
      let upd;
      try {
        const res = await readPdf(files[i]);
        res.txs = res.txs.map(t => ({ ...t, ...cls(t) }));
        upd = { state: "parsed", res };
      } catch (err) { upd = { state: "error", error: "PDFを読めませんでした：" + err.message }; }
      setItems(xs => xs.map(x => x.key === list[i].key ? { ...x, ...upd } : x));
    }
  };
  const save = async it => {
    const r = it.res, ds = r.txs.map(t => t.used_on).sort();
    const exists = statements.some(s => s.billing_date === r.billing_date);
    setItems(xs => xs.map(x => x.key === it.key ? { ...x, state: "saving" } : x));
    const p = {

      period_from: ds[0], period_to: ds[ds.length - 1],
      transactions: r.txs.map(t => ({ used_on: t.used_on, merchant_raw: t.merchant_raw, merchant: t.merchant, amount: t.amount, cardholder: t.cardholder,
        category: t.category, judgment: t.judgment, split_ratio: t.split_ratio, foreign_note: t.foreign_note })),
    };
    let error;
    try { ({ error } = await sb.rpc("card_save_statement", { p, p_overwrite: exists })); }
    catch (e) { error = { message: "保存できませんでした：" + e.message }; }
    setItems(xs => xs.map(x => x.key === it.key ? { ...x, state: error ? "parsed" : "saved", saveError: error && error.message } : x));
    if (!error) onSaved(r.billing_date);
  };
  return (
    <>
      <div className="card">
        <h2>明細PDFを取り込む</h2>

      </div>
      {items.map(it => <UploadItem key={it.key} it={it} statements={statements} onSave={() => save(it)} />)}

  );
}

// ---------- 領収書（撮る → 読む → 明細とひも付け）----------
// 紙の領収書は別途保管する前提。ここは探す・ひも付ける・「領収書なし」に気づくための控え。
// 読み取りは端末内の無料OCR（Tesseract）。追加の料金はかからない。
const RECEIPT_BUCKET = "card-receipts";
// 明細書そのものが証拠になるもの（紙の領収書が出ない・要らないもの）は「領収書なし」一覧から外す
const NO_RECEIPT_CATS = ["IT・サブスク", "通信費", "キャリア決済（ドコモ）", "保険", "光熱費", "高速・駐車場"];
const needsReceipt = t => t.amount > 0 && t.judgment !== "private" && !NO_RECEIPT_CATS.includes(t.category);

let ocrWorkerPromise = null;
function getOcr() {
  if (!ocrWorkerPromise) ocrWorkerPromise = new Promise((res, rej) => {
    const go = () => Tesseract.createWorker("jpn").then(res, rej);
    if (window.Tesseract) return go();
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    sc.onload = go; sc.onerror = () => rej(new Error("読み取りの準備に失敗しました"));
    document.head.appendChild(sc);
  }).catch(e => { ocrWorkerPromise = null; throw e; });
  return ocrWorkerPromise;
}
// 読み取った文字 → 金額・日付
function parseReceiptText(raw) {
  const z = raw.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[，､]/g, ",").replace(/[￥]/g, "¥")
    .replace(/(\d)[.．](\d{3})(?!\d)/g, "$1,$2"); // OCRはカンマをピリオドに読みがち（円に小数はない）
  const lines = z.split(/\n/).map(l => l.replace(/(\d)\s+(?=[\d,])/g, "$1").replace(/,\s+(?=\d)/g, ","));
  const num = s => { const m = s.match(/[¥\\]?\s*(\d{1,3}(?:,\d{3})+|\d{2,7})\s*円?/g); return m ? m.map(x => +x.replace(/[^\d]/g, "")).filter(n => n > 0 && n < 5000000) : []; };
  let amount = null;
  for (const re of [/(合\s*計|お\s*支\s*払|領\s*収\s*金\s*額|お\s*会\s*計|ご\s*請\s*求|御\s*請\s*求|税\s*込)/, /(小\s*計)/]) {
    for (const l of lines) if (re.test(l)) { const n = num(l.split(re).pop()); if (n.length) { amount = n[n.length - 1]; break; } }
    if (amount) break;
  }
  if (!amount) { const all = lines.flatMap(l => /[¥円]/.test(l) ? num(l) : []); if (all.length) amount = Math.max(...all); }
  let date = null;
  const t = z.replace(/\n/g, " "); // 日付は数字をくっつける前の文字から読む（「31 12:05」が「3112」にならないように）
  let m;
  if ((m = t.match(/(20\d{2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})/))) date = [m[1], m[2], m[3]];
  else if ((m = t.match(/令\s*和\s*(\d{1,2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})/))) date = [2018 + +m[1], m[2], m[3]];
  else if ((m = t.match(/(?:^|\D)(2\d)[\/.](\d{1,2})[\/.](\d{1,2})(?:\D|$)/))) date = ["20" + m[1], m[2], m[3]];
  const d = date && +date[1] >= 1 && +date[1] <= 12 && +date[2] >= 1 && +date[2] <= 31
    ? `${date[0]}-${String(date[1]).padStart(2, "0")}-${String(date[2]).padStart(2, "0")}` : null;
  return { amount, date: d };
}
const dayDiff = (a, b) => Math.round((new Date(a) - new Date(b)) / 86400000);
// 読み取り結果 → 明細の候補（金額が同じ＆日付が近い順）
function matchCandidates(txs, receipts, r, holder) {
  const linked = new Set(receipts.filter(x => x.transaction_id).map(x => x.transaction_id));
  let c = [];
  if (r.amount) c = txs.filter(t => t.amount === r.amount);
  else if (r.date) c = txs.filter(t => Math.abs(dayDiff(t.used_on, r.date)) <= 3);
  if (r.date) c = c.filter(t => Math.abs(dayDiff(t.used_on, r.date)) <= 10);
  const score = t => (r.date ? Math.abs(dayDiff(t.used_on, r.date)) : 5) + (t.cardholder === holder ? 0 : 3) + (linked.has(t.id) ? 20 : 0);
  return c.map(t => ({ t, s: score(t) })).sort((a, b) => a.s - b.s).slice(0, 5).map(x => x.t);
}
// 自動でひも付けてよいのは「金額が一致・日付が3日以内・候補が1件だけ」のとき
function autoPick(cands, r) {
  if (!r.amount || !r.date) return null;
  const near = cands.filter(t => Math.abs(dayDiff(t.used_on, r.date)) <= 3);
  return near.length === 1 ? near[0] : null;
}
async function fileToImages(file) {
  const out = [];
  const toBlob = cv => new Promise(res => cv.toBlob(res, "image/jpeg", 0.82));
  const fit = (w, h, max = 1600) => { const k = Math.min(1, max / Math.max(w, h)); return [Math.round(w * k), Math.round(h * k)]; };
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p), vp0 = page.getViewport({ scale: 1 });
      const [w] = fit(vp0.width * 2.2, vp0.height * 2.2), vp = page.getViewport({ scale: w / vp0.width });
      const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      out.push({ blob: await toBlob(cv), canvas: cv, name: `${file.name} p${p}` });
    }
  } else {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const [w, h] = fit(bmp.width, bmp.height);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
    out.push({ blob: await toBlob(cv), canvas: cv, name: file.name });
  }
  return out;
}
function useSignedUrl(path) {
  const [url, setUrl] = useState(null);
  useEffect(() => { let a = true; sb.storage.from(RECEIPT_BUCKET).createSignedUrl(path, 3600).then(({ data }) => a && data && setUrl(data.signedUrl)); return () => { a = false; }; }, [path]);
  return url;
}

    {url ? <img src={url} alt="領収書" /> : <span className="small">…</span>}</a>;

async function saveReceipt({ blob, read, txId, holder, text }) {
  const path = `${new Date().toISOString().slice(0, 7)}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const up = await sb.storage.from(RECEIPT_BUCKET).upload(path, blob, { contentType: "image/jpeg" });
  if (up.error) throw new Error("画像の保存に失敗：" + up.error.message);
  const { data, error } = await sb.from("card_receipts").insert({ path, transaction_id: txId || null, read_date: read.date, read_amount: read.amount,

  return data;
}

        {it.state === "error" && <div className="ngbox">{it.error}</div>}
        {it.read && <div className="sub">読み取り：<b>{it.read.date ? it.read.date.replace(/-/g, "/") : "日付？"}</b>・<b>{it.read.amount ? yen(it.read.amount) : "金額？"}</b></div>}
        {tx && <div className="okbox" style={{ marginTop: 6 }}>✅ ひも付けました：{md(tx.used_on)} {tx.merchant} {yen(tx.amount)}</div>}
      </div>
    </div>
    {it.state === "pick" && <>
      <div style={{ fontSize: 13, fontWeight: 600, marginTop: 8 }}>どの明細の領収書ですか？</div>
      <CandidatePicker cands={it.cands} busy={it.busy} onPick={t => onLink(it, t)} />
      <RetryBox read={it.read} onRetry={r => onRetry(it, r)} />
    </>}
  </div>;
}

function UnlinkedReceipt({ r, receipts, setReceipts, holder }) {
  const { txs } = React.useContext(CardCtx);
  const [read, setRead] = useState({ amount: r.read_amount, date: r.read_date });
  const [busy, setBusy] = useState(false);
  const cands = matchCandidates(txs, receipts, read, holder);
  const link = async t => {
    setBusy(true);
    const { data, error } = await sb.from("card_receipts").update({ transaction_id: t.id }).eq("id", r.id).select().single();
    setBusy(false);
    if (!error) setReceipts(rs => rs.map(x => x.id === data.id ? data : x));
  };
  return <div style={{ borderTop: "1px solid var(--line)", paddingTop: 10, marginTop: 10 }}>
    <div className="rrow"><ReceiptThumb path={r.path} />
      <div className="sub">読み取り：{r.read_date ? r.read_date.replace(/-/g, "/") : "日付？"}・{r.read_amount ? yen(r.read_amount) : "金額？"}</div></div>
    <CandidatePicker cands={cands} busy={busy} onPick={link} />
    <RetryBox read={read} onRetry={setRead} />
  </div>;
}

function Receipts({ me, receipts, setReceipts }) {
  const { txs } = React.useContext(CardCtx);
  const [items, setItems] = useState([]);
  const [showMissing, setShowMissing] = useState(false);
  const upd = (key, patch) => setItems(xs => xs.map(x => x.key === key ? { ...x, ...patch } : x));
  const linkedIds = new Set(receipts.filter(r => r.transaction_id).map(r => r.transaction_id));
  const inSession = new Set(items.map(i => i.id));
  const unlinked = receipts.filter(r => !r.transaction_id && !inSession.has(r.id));
  const mine = t => me.role === "owner" || t.cardholder === me.cardholder;
  const missing = txs.filter(t => mine(t) && needsReceipt(t) && !linkedIds.has(t.id)).sort((a, b) => b.used_on.localeCompare(a.used_on));

  const process = async files => {
    let known = receipts;
    for (const f of files) {
      let imgs;
      try { imgs = await fileToImages(f); } catch (e) { setItems(xs => [{ key: Math.random(), name: f.name, state: "error", error: "画像を開けませんでした：" + e.message }, ...xs]); continue; }
      for (const im of imgs) {
        const key = Math.random();
        setItems(xs => [{ key, name: im.name, preview: URL.createObjectURL(im.blob), state: "reading" }, ...xs]);
        try {
          const w = await getOcr();
          const { data } = await w.recognize(im.canvas);
          const read = parseReceiptText(data.text);
          const cands = matchCandidates(txs, known, read, me.cardholder);
          const pick = autoPick(cands, read);
          const saved = await saveReceipt({ blob: im.blob, read, txId: pick && pick.id, holder: me.cardholder, text: data.text });
          known = [...known, saved];
          setReceipts(rs => [...rs, saved]);
          upd(key, pick ? { state: "linked", read, txId: pick.id, id: saved.id } : { state: "pick", read, cands, id: saved.id });
        } catch (e) { upd(key, { state: "error", error: e.message }); }
      }
    }
  };
  const onLink = async (it, t) => {
    upd(it.key, { busy: true });
    const { data, error } = await sb.from("card_receipts").update({ transaction_id: t.id }).eq("id", it.id).select().single();
    if (error) return upd(it.key, { busy: false, state: "error", error: error.message });
    setReceipts(rs => rs.map(r => r.id === data.id ? data : r));
    upd(it.key, { busy: false, state: "linked", txId: t.id });
  };
  const onRetry = (it, read) => upd(it.key, { read: { ...it.read, ...read }, cands: matchCandidates(txs, receipts, read, me.cardholder) });
  const pickFiles = e => { const fs = [...e.target.files]; e.target.value = ""; process(fs); };

  return <>
    <div className="card">
      <h2>領収書を取り込む</h2>
      <div className="bigbtns" style={{ marginTop: 6 }}>
        <label className="filebtn b-work">📷 撮る<input type="file" accept="image/*" capture="environment" onChange={pickFiles} /></label>
        <label className="filebtn b-ask">🗂 スキャン・写真を選ぶ（まとめてOK）<input type="file" accept="image/*,application/pdf" multiple onChange={pickFiles} /></label>
      </div>
      <div className="small" style={{ marginTop: 8 }}>金額と日付を読み取って、カード明細と自動でひも付けます。迷ったときは候補から選ぶだけ。<b>紙の領収書は今まで通り保管</b>してください（これは探す・確認するための控えです）。</div>
    </div>
    {items.map(it => <ReceiptItem key={it.key} it={it} onLink={onLink} onRetry={onRetry} />)}
    {unlinked.length > 0 && <div className="card"><h2>ひも付けがまだの領収書（{unlinked.length}件）</h2>
      {unlinked.map(r => <UnlinkedReceipt key={r.id} r={r} receipts={receipts} setReceipts={setReceipts} holder={me.cardholder} />)}
    </div>}
    <div className="card">
      <div className="top"><h2 style={{ margin: 0 }}>領収書がまだない明細</h2><b className="num">{missing.length}件</b></div>
      <div className="small">ETC・サブスク・通信費など明細書だけで足りるものと、私用の分は除いています。</div>
      <button className="link" onClick={() => setShowMissing(v => !v)}>{showMissing ? "閉じる" : "一覧を見る"}</button>
      {showMissing && <div className="list">{missing.slice(0, 200).map(t => <div className="tx" key={t.id} style={{ cursor: "default" }}>
        <div className="d num">{md(t.used_on)}<br /><span className="sw" style={{ background: HOLDERS[t.cardholder].color }}></span></div>
        <div className="m"><div className="mn">{t.merchant}</div><div className="meta"><span className="chip">{t.category}</span><Judge j={t.judgment} q={t.question} /></div></div>
        <div className="a">{yen(t.amount)}</div></div>)}</div>}
    </div>
  </>;
}

// 明細の編集画面に出す「この明細の領収書」
function TxReceipts({ tx, canEdit }) {
  const { receipts, setReceipts, me } = React.useContext(CardCtx);
  const mine = receipts.filter(r => r.transaction_id === tx.id);
  const [busy, setBusy] = useState(false), [err, setErr] = useState("");
  const add = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    setBusy(true); setErr("");
    try {
      const [im] = await fileToImages(f);
      const saved = await saveReceipt({ blob: im.blob, read: { amount: tx.amount, date: tx.used_on }, txId: tx.id, holder: me.cardholder, text: "" });
      setReceipts(rs => [...rs, saved]);
    } catch (e2) { setErr(e2.message); }
    setBusy(false);
  };
  const unlink = async r => {
    const { data, error } = await sb.from("card_receipts").update({ transaction_id: null }).eq("id", r.id).select().single();
    if (!error) setReceipts(rs => rs.map(x => x.id === data.id ? data : x));
  };
  return <div className="field"><label>領収書</label>
    {mine.length ? <div className="rrow" style={{ flexWrap: "wrap" }}>{mine.map(r => <div key={r.id}><ReceiptThumb path={r.path} big />
      {canEdit && <button className="link" onClick={() => unlink(r)}>外す</button>}</div>)}</div>
      : <div className="small">{needsReceipt(tx) ? "⚠ まだ領収書がありません" : "（明細書だけで足りる支払いです）"}</div>}
    {canEdit && <label className="filebtn b-ask" style={{ marginTop: 8 }}>{busy ? "保存中…" : "📷 この明細に領収書を付ける"}<input type="file" accept="image/*" capture="environment" onChange={add} disabled={busy} /></label>}
    {err && <div className="ngbox">{err}</div>}
  </div>;
}

// ---------- 全体 ----------
const ic = d => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
const Icon = {
  home: ic(<><path d="M3 11l9-7 9 7" /><path d="M5 10v10h14V10" /></>),
  check: ic(<><path d="M9 11l3 3L22 4" /><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" /></>),
  list: ic(<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />),
  chart: ic(<path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />),
  receipt: ic(<><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z" /><path d="M9 7h6M9 11h6M9 15h4" /></>),
  more: ic(<><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></>),
};

async function loadAllTx() {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from("card_transactions").select("*").order("id").range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out;
  }
}

function Main({ session }) {
  const [me, setMe] = useState(undefined), [statements, setStatements] = useState([]), [txs, setTxs] = useState([]), [stmtId, setStmtId] = useState(null);
  const [rules, setRules] = useState([]), [names, setNames] = useState([]), [work, setWork] = useState({}), [receipts, setReceipts] = useState([]);
  const [tab, setTab] = useState(null), [err, setErr] = useState(""), [loading, setLoading] = useState(true);

  const reloadRules = useCallback(async () => {
    const [r, n] = await Promise.all([sb.from("card_merchant_rules").select("*"), sb.from("card_merchant_names").select("*")]);
    if (!r.error) setRules(r.data); if (!n.error) setNames(n.data);
  }, []);
  const loadAll = useCallback(async preferDate => {
    try {
      const { data, error } = await sb.from("card_statements").select("*").order("billing_date", { ascending: false });
      if (error) throw error;
      const all = await loadAllTx();
      setStatements(data); setTxs(all);
      const pick = (preferDate && data.find(s => s.billing_date === preferDate)) || data[0];
      setStmtId(id => preferDate ? pick && pick.id : (data.some(s => s.id === id) ? id : pick && pick.id));
      return all;
    } catch (e) { setErr(e.message); return []; }
  }, []);
  useEffect(() => {
    (async () => {
      const { data, error } = await sb.from("card_members").select("*").eq("user_id", session.user.id).maybeSingle();
      if (error) setErr(error.message);
      setMe(data || null);
      if (data) {
        const [all] = await Promise.all([loadAll(), reloadRules()]);
        sb.from("card_receipts").select("*").then(({ data: rc }) => rc && setReceipts(rc));
        if (data.role === "owner") sb.rpc("card_work_days").then(({ data: wd }) => wd && setWork(Object.fromEntries(wd.map(w => [w.day, w]))));
        const pending = all.filter(t => t.cardholder === data.cardholder && t.judgment === "check" && !t.question).length;
        setTab(data.role === "member" && pending ? "check" : "home");
      }
      setLoading(false);
    })();
  }, [session.user.id]);

  const updateTx = useCallback(async (id, patch) => {
    try {
      const { data, error } = await sb.from("card_transactions").update(patch).eq("id", id).select().single();
      if (error) return error.message;
      setTxs(ts => ts.map(t => t.id === id ? data : t));
      return null;
    } catch (e) { return "保存できませんでした：" + e.message; }
  }, []);

  if (me === undefined || (me && loading)) return <div className="wrap sub">読み込み中…</div>;
  if (me === null) return <div className="wrap"><div className="card">このアカウントはまだ登録されていません。としに連絡してください。
    <div><button className="link" onClick={() => sb.auth.signOut()}>ログアウト</button></div>{err && <div className="ngbox">{err}</div>}</div></div>;
  const checkCount = txs.filter(t => t.cardholder === me.cardholder && t.judgment === "check" && !t.question).length
    + (me.role === "owner" ? txs.filter(t => t.question).length : 0);
  const go = t => { setTab(t); window.scrollTo(0, 0); };
  const tabs = [["home", "ホーム", Icon.home], ["check", "チェック", Icon.check], ["tx", "明細", Icon.list], ["receipt", "領収書", Icon.receipt], ["analysis", "分析", Icon.chart], ["more", "その他", Icon.more]];
  return (
    <CardCtx.Provider value={{ txs, work, receipts, setReceipts, me }}>
      <div className="wrap">
        <div className="top hdr">
          <h1>カード明細チェック</h1>
          <span className="who"><span className="sw" style={{ background: HOLDERS[me.cardholder].color }}></span>{me.display_name}
            <button className="link" onClick={() => sb.auth.signOut()}>ログアウト</button></span>
        </div>
        {err && <div className="ngbox">{err}</div>}
        {tab === "home" && <Home me={me} statements={statements} txs={txs} stmtId={stmtId} setStmtId={setStmtId} go={go} />}
        {tab === "check" && <Check me={me} txs={txs} updateTx={updateTx} />}
        {tab === "tx" && <Transactions me={me} statements={statements} txs={txs} stmtId={stmtId} setStmtId={setStmtId} updateTx={updateTx} rules={rules} reloadRules={reloadRules} />}
        {tab === "receipt" && <Receipts me={me} receipts={receipts} setReceipts={setReceipts} />}
        {tab === "analysis" && <Analysis me={me} statements={statements} txs={txs} />}
        {tab === "more" && <More me={me} statements={statements} rules={rules} names={names} onSaved={d => loadAll(d)} />}
      </div>
      <div className="ver">{APP_VERSION}</div>
      <nav className="nav">
        {tabs.map(([k, l, i]) => <button key={k} className={tab === k ? "on" : ""} onClick={() => go(k)}>
          <span className="ni">{i}{k === "check" && checkCount > 0 && <span className="badge">{checkCount > 99 ? "99+" : checkCount}</span>}</span>{l}</button>)}
      </nav>
    </CardCtx.Provider>
  );
}

function App() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  if (session === undefined) return null;
  return session ? <Main key={session.user.id} session={session} /> : <Login />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
