<script>
// ===== セゾン明細パーサー（pdf.js の getTextContent 結果 → 明細データ）=====
// 画面の外でも動くよう素のJSで書いている（Nodeで実PDFを使ったテスト済み）
function cardPdfRows(pages){
  const out=[];
  for(const pg of pages){
    const rows=[];
    for(const it of pg.items){
      if(!it.str||!it.str.trim()) continue;
      const x=it.transform[4], y=it.transform[5];
      let r=rows.find(r=>Math.abs(r.y-y)<2.5);
      if(!r){ r={y,cells:[]}; rows.push(r); }
      r.cells.push({x,s:it.str.trim()});
    }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){ r.cells.sort((a,b)=>a.x-b.x); out.push(r.cells.map(c=>c.s)); }
  }
  return out;
}
const cardNum=s=>parseInt(String(s).replace(/[\s,円]/g,''),10);
// 表示名の元になるキー：QP/（QUICPay）を外し、空白を1つに揃える
function cardCleanMerchant(raw){ return raw.replace(/\s+/g,' ').replace(/^QP\//,'').trim(); }
function cardHolderOf(name){
  if(/モモエ|萌々恵|ももえ/.test(name)) return 'momoe';
  if(/敏徳|トシノリ|としのり/.test(name)) return 'toshi';
  return null;
}
function cardParseStatement(pages){
  const rows=cardPdfRows(pages);
  const res={total:null,billing_date:null,subtotal:{},txs:[],errors:[],warnings:[]};
  let who=null, last=null, done=false;
  for(const cells of rows){
    const line=cells.join(' ');
    const flat=line.replace(/\s/g,'');
    if(res.total==null && /^ご請求金額/.test(flat)){
      const m=flat.match(/ご請求金額(-?[\d,]+)円/); if(m) res.total=cardNum(m[1]); continue;
    }
    if(!res.billing_date && /^お支払日/.test(flat)){
      const m=flat.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if(m) res.billing_date=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`; continue;
    }
    if(done) continue;
    const um=flat.match(/^ご利用者名[:：](.+?)様/);
    if(um){ who=cardHolderOf(um[1]); if(!who) res.errors.push(`利用者名を判別できません：${um[1]}`); last=null; continue; }
    if(!who) continue;
    // 家族カードの小計行は「【小計】 1 426976」のように家族印が混ざるので最後のセルを金額とする
    if(/^【小計】/.test(flat)){ res.subtotal[who]=cardNum(cells[cells.length-1]); last=null; continue; }
    if(/^【合計】/.test(flat)){ last=null; continue; }
    if(/^\d+\/\d+$/.test(flat)||/^ご利用明細$|^ご利用$|^年月日|^ご利用店名|^「/.test(flat)) continue;
    // 取引行：先頭が「数字とスペースで8桁」の日付
    const d=cells[0].replace(/\s/g,'');
    if(/^\d{8}$/.test(d) && cells.length>=3){
      const iPay=cells.findIndex((c,i)=>i>0 && /^\d*回$|^リボ|^分割|^ボーナス/.test(c.replace(/\s/g,'')));
      if(iPay<0 || iPay+1>=cells.length){ res.errors.push(`読めない行：${line}`); continue; }
      let mCells=cells.slice(1,iPay);
      let family=false;
      if(mCells.length>1 && mCells[mCells.length-1]==='1'){ family=true; mCells=mCells.slice(0,-1); }
      if(cells[iPay].replace(/\s/g,'')!=='1回') res.warnings.push(`1回払い以外の行：${line}`);
      const amount=cardNum(cells[iPay+1]);
      if(isNaN(amount)){ res.errors.push(`金額が読めない行：${line}`); continue; }
      const raw=mCells.join(' ');
      const note=cells.slice(iPay+2).join(' ');
      if(family && who!=='momoe') res.warnings.push(`家族カード印があるのに本会員の欄：${line}`);
      last={used_on:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`, merchant_raw:raw, name_key:cardCleanMerchant(raw),
            amount, cardholder:who, foreign_note: note||null};
      res.txs.push(last); continue;
    }
    // 外貨の続き行（例：「(SINGAPORE) 円換算レート:8/23 165.1200」）
    if(last && last.foreign_note!=null){ last.foreign_note=(last.foreign_note+' '+line).trim(); continue; }
    if(/規約|第\d+条/.test(flat)){ done=true; continue; }
  }
  for(const t of res.txs){
    if(!t.foreign_note) continue;
    const a=t.foreign_note.match(/現地通貨額[:：]\s*([\d.,]+)\s*([A-Z]{3})/);
    const r=t.foreign_note.match(/円換算レート[:：]\s*(\d+\/\d+)\s*([\d.]+)/);
    if(a) t.foreign_note=`${a[1]} ${a[2]}`+(r?` / ${r[1]} ${Number(r[2])}円`:'');
  }
  // 検算：利用者ごとの合計＝【小計】、総額＝ご請求金額
  if(res.total==null) res.errors.push('ご請求金額が見つかりません');
  if(!res.billing_date) res.errors.push('お支払日が見つかりません');
  const sums={};
  for(const t of res.txs) sums[t.cardholder]=(sums[t.cardholder]||0)+t.amount;
  res.sums=sums;
  const nm=k=>k==='toshi'?'敏徳':'萌々恵';
  for(const k of new Set([...Object.keys(sums),...Object.keys(res.subtotal)])){
    if(res.subtotal[k]==null) res.errors.push(`${nm(k)}の【小計】が見つかりません`);
    else if(res.subtotal[k]!==(sums[k]||0)) res.errors.push(`${nm(k)}：明細の合計 ${(sums[k]||0).toLocaleString()}円 ≠ 小計 ${res.subtotal[k].toLocaleString()}円（差 ${((sums[k]||0)-res.subtotal[k]).toLocaleString()}円）`);
  }
  const all=Object.values(sums).reduce((a,b)=>a+b,0);
  if(res.total!=null && all!==res.total) res.errors.push(`明細の総額 ${all.toLocaleString()}円 ≠ ご請求金額 ${res.total.toLocaleString()}円（差 ${(all-res.total).toLocaleString()}円）`);
  if(!res.txs.length) res.errors.push('利用明細の行が1件も見つかりません（セゾンの明細PDFか確認してください）');
  res.ok=res.errors.length===0;
  return res;
}
</script>
<script type="text/babel" data-presets="react">
const APP_VERSION = "2026-09-25-v0.2-icon";
const SB_URL = "https://ckcykbvislsjwvkizkqc.supabase.co";
const SB_KEY = "sb_publishable_5kDZMBvSMk2Cu8qz8IP9CQ_qWsN1C13"; // 公開用キー。データはRLSで守る
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, storageKey: "card-check-auth" } });
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const { useState, useEffect, useMemo, useCallback } = React;

const HOLDERS = { toshi: { name: "敏徳", color: "var(--s1)" }, momoe: { name: "萌々恵", color: "var(--s2)" } };
const CATEGORY_GROUPS = [
  ["移動・車", ["旅行（移動・宿）", "電車・タクシー", "ガソリン", "高速・駐車場", "車の部品・用品"]],
  ["仕事・固定費", ["IT・サブスク", "通信費", "キャリア決済（ドコモ）", "保険", "光熱費", "役所手数料"]],
  ["食費", ["食料品（スーパー）", "食料品（お米・食材通販）", "外食"]],
  ["買い物", ["ネット通販", "衣類・雑貨・コスメ", "ホームセンター・雑貨", "ドラッグストア", "コンビニ・日用品"]],
  ["暮らし", ["医療・サプリ", "美容サロン", "娯楽・レジャー", "ペット", "その他・不明"]],
];
const CATEGORIES = CATEGORY_GROUPS.flatMap(g => g[1]);
const JUDGMENTS = {
  expense: { label: "経費になる", short: "経費" },
  private: { label: "私用（経費にならない）", short: "私用" },
  split:   { label: "一部だけ経費（按分）", short: "按分" },
  check:   { label: "要確認（使い道による）", short: "要確認" },
};
const yen = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("ja-JP") + "円";
const md = d => { const [, m, dd] = d.split("-"); return `${+m}/${+dd}`; };
const monthLabel = bd => { const [y, m] = bd.split("-"); return `${y}年${+m}月引落し`; };

// 店名 → 表示名・カテゴリ
function makeClassifier(rules, names) {
  const sorted = [...rules].sort((a, b) => a.priority - b.priority || a.id - b.id);
  const nameMap = Object.fromEntries(names.map(n => [n.name_key, n.display]));
  return t => {
    const display = nameMap[t.name_key] || t.name_key;
    const hit = sorted.find(r => t.merchant_raw.includes(r.pattern) || display.includes(r.pattern));
    return { merchant: display, category: hit ? hit.category : "その他・不明" };
  };
}

function Judge({ j }) {
  return <span className={"jb j-" + j}>{j === "check" ? "⚠ " : ""}{JUDGMENTS[j].short}</span>;
}
function Who({ h }) {
  return <span className="who"><span className="sw" style={{ background: HOLDERS[h].color }}></span>{HOLDERS[h].name}</span>;
}

// ---------- ログイン ----------
function Login() {
  const [email, setEmail] = useState(""), [pw, setPw] = useState(""), [err, setErr] = useState(""), [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault(); setBusy(true); setErr("");
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) setErr(/Invalid login/i.test(error.message) ? "メールアドレスかパスワードが違います" : error.message);
  };
  return (
    <div className="wrap"><div className="login card">
      <h1>カード明細チェック</h1>
      <p className="sub" style={{ margin: "4px 0 12px" }}>セゾン ビジネスカードの明細を2人で確認するアプリです</p>
      <form onSubmit={submit}>
        <div className="field"><label>メールアドレス</label><input type="email" autoComplete="username" value={email} onChange={e => setEmail(e.target.value)} required /></div>
        <div className="field"><label>パスワード</label><input type="password" autoComplete="current-password" value={pw} onChange={e => setPw(e.target.value)} required /></div>
        {err && <div className="ngbox">{err}</div>}
        <button className="primary" style={{ width: "100%", marginTop: 16 }} disabled={busy}>{busy ? "ログイン中…" : "ログイン"}</button>
      </form>
    </div></div>
  );
}

// ---------- 明細 ----------
function Transactions({ me, statements, stmtId, setStmtId }) {
  const [txs, setTxs] = useState(null), [err, setErr] = useState("");
  const [fHolder, setFHolder] = useState(""), [fCat, setFCat] = useState(""), [fJ, setFJ] = useState(""), [sort, setSort] = useState("date");
  const [edit, setEdit] = useState(null);
  const stmt = statements.find(s => s.id === stmtId);

  useEffect(() => {
    if (!stmtId) return;
    setTxs(null); setErr("");
    sb.from("card_transactions").select("*").eq("statement_id", stmtId).order("used_on").order("id")
      .then(({ data, error }) => { if (error) setErr(error.message); else setTxs(data); });
  }, [stmtId]);

  const shown = useMemo(() => {
    if (!txs) return [];
    let a = txs.filter(t => (!fHolder || t.cardholder === fHolder) && (!fCat || t.category === fCat) && (!fJ || t.judgment === fJ));
    if (sort === "amount") a = [...a].sort((x, y) => y.amount - x.amount);
    return a;
  }, [txs, fHolder, fCat, fJ, sort]);
  const shownSum = shown.reduce((s, t) => s + t.amount, 0);
  const catsInMonth = useMemo(() => txs ? CATEGORIES.filter(c => txs.some(t => t.category === c)) : [], [txs]);

  if (!statements.length) return <div className="card">まだ明細がありません。{me.role === "owner" ? "「取り込み」からPDFを読み込んでください。" : ""}</div>;
  return (
    <>
      <div className="card" style={{ paddingBottom: 12 }}>
        <select value={stmtId || ""} onChange={e => setStmtId(+e.target.value)} style={{ width: "100%", fontWeight: 600 }}>
          {statements.map(s => <option key={s.id} value={s.id}>{monthLabel(s.billing_date)}</option>)}
        </select>
        {stmt && <div className="tiles" style={{ marginTop: 10 }}>
          <div className="tile"><div className="l">ご請求額</div><div className="v">{yen(stmt.total)}</div></div>
          <div className="tile"><div className="l"><span className="sw" style={{ background: HOLDERS.toshi.color }}></span>敏徳</div><div className="v">{yen(stmt.subtotal_toshi)}</div></div>
          <div className="tile"><div className="l"><span className="sw" style={{ background: HOLDERS.momoe.color }}></span>萌々恵</div><div className="v">{yen(stmt.subtotal_momoe)}</div></div>
        </div>}
      </div>
      <div className="card">
        <div className="ctrl">
          <select value={fHolder} onChange={e => setFHolder(e.target.value)}>
            <option value="">2人とも</option><option value="toshi">敏徳</option><option value="momoe">萌々恵</option>
          </select>
          <select value={fCat} onChange={e => setFCat(e.target.value)}>
            <option value="">すべてのカテゴリ</option>{catsInMonth.map(c => <option key={c}>{c}</option>)}
          </select>
          <select value={fJ} onChange={e => setFJ(e.target.value)}>
            <option value="">すべての判定</option>{Object.entries(JUDGMENTS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
          </select>
          <select value={sort} onChange={e => setSort(e.target.value)}>
            <option value="date">日付順</option><option value="amount">金額の大きい順</option>
          </select>
        </div>
        <div className="sub" style={{ marginTop: 8 }}>{txs ? <><span className="num">{shown.length}</span>件・合計 <b className="num">{yen(shownSum)}</b></> : "読み込み中…"}</div>
        {err && <div className="ngbox">{err}</div>}
        <div className="list">
          {shown.map(t => (
            <div className="tx" key={t.id} onClick={() => setEdit(t)}>
              <div className="d num">{md(t.used_on)}<br /><span className="sw" style={{ background: HOLDERS[t.cardholder].color }}></span></div>
              <div className="m">
                <div className="mn">{t.merchant}</div>
                <div className="meta"><span className="chip">{t.category}</span><Judge j={t.judgment} />{t.purpose_memo && <span className="small">📝</span>}</div>
              </div>
              <div className={"a" + (t.amount < 0 ? " neg" : "")}>{yen(t.amount)}</div>
            </div>
          ))}
        </div>
      </div>
      <p className="disclaimer">経費かどうかの判定は目安です。最終的な判断は顧問税理士に確認します。</p>
      {edit && <EditSheet me={me} tx={edit} onClose={() => setEdit(null)}
        onSaved={nt => { setTxs(ts => ts.map(t => t.id === nt.id ? nt : t)); setEdit(null); }} />}
    </>
  );
}

function EditSheet({ me, tx, onClose, onSaved }) {
  const isOwner = me.role === "owner";
  const canEdit = isOwner || tx.cardholder === me.cardholder;
  const [category, setCategory] = useState(tx.category);
  const [judgment, setJudgment] = useState(tx.judgment);
  const [ratio, setRatio] = useState(tx.split_ratio != null ? Math.round(tx.split_ratio * 100) : 50);
  const [memo, setMemo] = useState(tx.purpose_memo || "");
  const [busy, setBusy] = useState(false), [err, setErr] = useState("");
  const save = async () => {
    setBusy(true); setErr("");
    const patch = { judgment, split_ratio: judgment === "split" ? Math.min(100, Math.max(0, +ratio)) / 100 : null, purpose_memo: memo.trim() || null };
    if (isOwner) { patch.category = category; if (judgment !== tx.judgment || patch.split_ratio !== tx.split_ratio) patch.judgment_source = "manual"; }
    try {
      const { data, error } = await sb.from("card_transactions").update(patch).eq("id", tx.id).select().single();
      if (error) setErr(error.message); else onSaved(data);
    } catch (e) { setErr("保存できませんでした：" + e.message); }
    setBusy(false);
  };
  return (
    <div className="sheet-bg" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="top"><Who h={tx.cardholder} /><button className="link" onClick={onClose}>閉じる</button></div>
        <div style={{ fontSize: 18, fontWeight: 700, marginTop: 4 }}>{tx.merchant}</div>
        <div className="num" style={{ fontSize: 22, fontWeight: 700 }}>{yen(tx.amount)}</div>
        <div className="small">{tx.used_on.replace(/-/g, "/")} ・ 明細の表記：{tx.merchant_raw}{tx.foreign_note ? ` ・ ${tx.foreign_note}` : ""}</div>

        <div className="field"><label>カテゴリ</label>
          {isOwner ? <select value={category} onChange={e => setCategory(e.target.value)} style={{ width: "100%" }}>
            {CATEGORY_GROUPS.map(([g, cs]) => <optgroup key={g} label={g}>{cs.map(c => <option key={c}>{c}</option>)}</optgroup>)}
          </select> : <div>{tx.category}</div>}
        </div>

        <div className="field"><label>経費になる？</label>
          {canEdit ? <div className="seg">
            {Object.entries(JUDGMENTS).map(([k, v]) =>
              <button key={k} className={"j-" + k + (judgment === k ? " on" : "")} onClick={() => setJudgment(k)}>{v.label}</button>)}
          </div> : <Judge j={tx.judgment} />}
          {tx.judgment_source === "manual" && <div className="small" style={{ marginTop: 4 }}>手で入力した判定です</div>}
        </div>
        {canEdit && judgment === "split" && <div className="field"><label>仕事で使った割合（%）</label>
          <input type="number" inputMode="numeric" min="0" max="100" value={ratio} onChange={e => setRatio(e.target.value)} style={{ width: 120 }} /></div>}

        <div className="field"><label>用途メモ（誰と・何のため）</label>
          {canEdit ? <textarea rows="2" value={memo} onChange={e => setMemo(e.target.value)} placeholder="例：〇〇さんと打ち合わせ／△△の物件を見に行った" />
            : <div>{tx.purpose_memo || <span className="small">なし</span>}</div>}
        </div>
        {!canEdit && <div className="flag">これは{HOLDERS[tx.cardholder].name}さんの利用分なので、見るだけです。</div>}
        {err && <div className="ngbox">{err}</div>}
        {canEdit && <button className="primary" style={{ width: "100%", marginTop: 16 }} onClick={save} disabled={busy}>{busy ? "保存中…" : "保存する"}</button>}
      </div>
    </div>
  );
}

// ---------- 取り込み（オーナーのみ） ----------
async function readPdf(file) {
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) pages.push(await (await doc.getPage(p)).getTextContent());
  return cardParseStatement(pages);
}

function Upload({ statements, onSaved }) {
  const [items, setItems] = useState([]);
  const [cls, setCls] = useState(null), [loadErr, setLoadErr] = useState("");
  useEffect(() => {
    Promise.all([sb.from("card_merchant_rules").select("*"), sb.from("card_merchant_names").select("*")]).then(([r, n]) => {
      if (r.error || n.error) setLoadErr((r.error || n.error).message); else setCls(() => makeClassifier(r.data, n.data));
    });
  }, []);

  const pick = async e => {
    const files = [...e.target.files]; e.target.value = "";
    const list = files.map(f => ({ key: f.name + f.size + Math.random(), name: f.name, state: "reading" }));
    setItems(list);
    for (const it of list) {
      const f = files[list.indexOf(it)];
      let upd;
      try {
        const res = await readPdf(f);
        res.txs = res.txs.map(t => ({ ...t, ...cls(t) }));
        upd = { state: "parsed", res };
      } catch (err) { upd = { state: "error", error: "PDFを読めませんでした：" + err.message }; }
      setItems(xs => xs.map(x => x.key === it.key ? { ...x, ...upd } : x));
    }
  };
  const save = async it => {
    const r = it.res, ds = r.txs.map(t => t.used_on).sort();
    const exists = statements.some(s => s.billing_date === r.billing_date);
    setItems(xs => xs.map(x => x.key === it.key ? { ...x, state: "saving" } : x));
    const p = {
      billing_date: r.billing_date, total: r.total, subtotal_toshi: r.subtotal.toshi || 0, subtotal_momoe: r.subtotal.momoe || 0,
      period_from: ds[0], period_to: ds[ds.length - 1],
      transactions: r.txs.map(t => ({ used_on: t.used_on, merchant_raw: t.merchant_raw, merchant: t.merchant, amount: t.amount, cardholder: t.cardholder, category: t.category, foreign_note: t.foreign_note })),
    };
    let error;
    try { ({ error } = await sb.rpc("card_save_statement", { p, p_overwrite: exists })); }
    catch (e) { error = { message: "保存できませんでした：" + e.message }; }
    setItems(xs => xs.map(x => x.key === it.key ? { ...x, state: error ? "parsed" : "saved", saveError: error && error.message } : x));
    if (!error) onSaved(r.billing_date);
  };

  return (
    <>
      <div className="card">
        <h2>明細PDFを取り込む</h2>
        <p className="sub" style={{ marginTop: 0 }}>セゾンの「ご利用明細書」PDFを選んでください（複数まとめて選べます）。読み取りはこの端末の中だけで行い、PDFそのものは保存しません。カード番号・口座番号も保存しません。</p>
        {loadErr && <div className="ngbox">{loadErr}</div>}
        <input type="file" accept="application/pdf,.pdf" multiple onChange={pick} disabled={!cls} style={{ width: "100%" }} />
      </div>
      {items.map(it => <UploadItem key={it.key} it={it} statements={statements} onSave={() => save(it)} />)}
    </>
  );
}

function UploadItem({ it, statements, onSave }) {
  const [confirmOverwrite, setConfirmOverwrite] = useState(false), [showRows, setShowRows] = useState(false);
  if (it.state === "reading") return <div className="card">{it.name}：読み取り中…</div>;
  if (it.state === "error") return <div className="card"><b>{it.name}</b><div className="ngbox">{it.error}</div></div>;
  const r = it.res;
  const exists = statements.some(s => s.billing_date === r.billing_date);
  const byCat = {};
  for (const t of r.txs) { const c = byCat[t.category] || (byCat[t.category] = { toshi: 0, momoe: 0 }); c[t.cardholder] += t.amount; }
  const cats = Object.entries(byCat).map(([c, v]) => ({ c, ...v, sum: v.toshi + v.momoe })).sort((a, b) => b.sum - a.sum);
  const max = Math.max(...cats.map(c => c.sum), 1);
  const unknown = r.txs.filter(t => t.category === "その他・不明");
  return (
    <div className="card">
      <div className="top"><b>{r.billing_date ? monthLabel(r.billing_date) : it.name}</b><span className="small">{it.name}</span></div>
      {r.ok
        ? <div className="okbox">✅ 検算OK：明細 <b className="num">{r.txs.length}</b>件の合計がご請求金額 <b className="num">{yen(r.total)}</b> と一致しました
            <ul>{Object.keys(r.subtotal).map(k => <li key={k}>{HOLDERS[k].name}：<span className="num">{r.txs.filter(t => t.cardholder === k).length}</span>件 <span className="num">{yen(r.subtotal[k])}</span></li>)}</ul></div>
        : <div className="ngbox">❌ 合計が合わないため保存できません<ul>{r.errors.map((e, i) => <li key={i}>{e}</li>)}</ul></div>}
      {r.warnings.length > 0 && <div className="flag"><ul style={{ margin: 0, paddingLeft: 18 }}>{r.warnings.map((w, i) => <li key={i}>{w}</li>)}</ul></div>}

      {r.txs.length > 0 && <>
        <div style={{ marginTop: 14, fontSize: 13, fontWeight: 600 }}>振り分けの結果</div>
        <div style={{ marginTop: 6 }}>
          {cats.map(c => <div className="catbar" key={c.c}>
            <div className="n">{c.c}</div>
            <div className="bar" style={{ background: "none" }}>
              <span style={{ width: (Math.max(c.toshi, 0) / max * 100) + "%", background: HOLDERS.toshi.color }}></span>
              <span style={{ width: (Math.max(c.momoe, 0) / max * 100) + "%", background: HOLDERS.momoe.color }}></span>
            </div>
            <div className="a">{yen(c.sum)}</div>
          </div>)}
        </div>
        {unknown.length > 0 && <div className="small" style={{ marginTop: 6 }}>「その他・不明」{unknown.length}件：{unknown.map(t => t.merchant).join("、")}</div>}
        <button className="link" onClick={() => setShowRows(v => !v)}>{showRows ? "明細を閉じる" : `明細${r.txs.length}件を見る`}</button>
        {showRows && <div className="tbl"><table><thead><tr><th>日付</th><th>店名</th><th>カテゴリ</th><th className="r">金額</th></tr></thead><tbody>
          {r.txs.map((t, i) => <tr key={i}><td className="num">{md(t.used_on)}<span className="sw" style={{ background: HOLDERS[t.cardholder].color, marginLeft: 4 }}></span></td>
            <td>{t.merchant}{t.foreign_note && <div className="small">{t.foreign_note}</div>}</td><td className="small">{t.category}</td><td className="r">{yen(t.amount)}</td></tr>)}
        </tbody></table></div>}
      </>}

      {it.state === "saved" ? <div className="okbox">保存しました</div> : r.ok && <>
        {exists && <label className="flag" style={{ display: "block" }}>
          <input type="checkbox" checked={confirmOverwrite} onChange={e => setConfirmOverwrite(e.target.checked)} style={{ marginRight: 6 }} />
          この月はすでに登録済みです。<b>上書きする</b>（手で入れた判定・メモは引き継ぎます）
        </label>}
        {it.saveError && <div className="ngbox">{it.saveError}</div>}
        <button className="primary" style={{ width: "100%", marginTop: 12 }} disabled={it.state === "saving" || (exists && !confirmOverwrite)} onClick={onSave}>
          {it.state === "saving" ? "保存中…" : exists ? "上書きして保存" : "この内容で保存"}
        </button>
      </>}
    </div>
  );
}

// ---------- 全体 ----------
const Icon = {
  list: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>,
  upload: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" /></svg>,
};

function Main({ session }) {
  const [me, setMe] = useState(undefined), [statements, setStatements] = useState([]), [stmtId, setStmtId] = useState(null);
  const [tab, setTab] = useState("tx"), [err, setErr] = useState("");
  const loadStatements = useCallback(async preferDate => {
    const { data, error } = await sb.from("card_statements").select("*").order("billing_date", { ascending: false });
    if (error) { setErr(error.message); return; }
    setStatements(data);
    const pick = (preferDate && data.find(s => s.billing_date === preferDate)) || data[0];
    setStmtId(id => preferDate ? pick && pick.id : (data.some(s => s.id === id) ? id : pick && pick.id));
  }, []);
  useEffect(() => {
    sb.from("card_members").select("*").eq("user_id", session.user.id).maybeSingle().then(({ data, error }) => {
      if (error) setErr(error.message);
      setMe(data || null);
      if (data) loadStatements();
    });
  }, [session.user.id]);

  if (me === undefined) return <div className="wrap sub">読み込み中…</div>;
  if (me === null) return <div className="wrap"><div className="card">このアカウントはまだ登録されていません。としに連絡してください。
    <div><button className="link" onClick={() => sb.auth.signOut()}>ログアウト</button></div>{err && <div className="ngbox">{err}</div>}</div></div>;
  const isOwner = me.role === "owner";
  return (
    <>
      <div className="wrap">
        <div className="top hdr">
          <h1>カード明細チェック</h1>
          <span className="who"><span className="sw" style={{ background: HOLDERS[me.cardholder].color }}></span>{me.display_name}
            <button className="link" onClick={() => sb.auth.signOut()}>ログアウト</button></span>
        </div>
        {err && <div className="ngbox">{err}</div>}
        {tab === "tx" && <Transactions me={me} statements={statements} stmtId={stmtId} setStmtId={setStmtId} />}
        {tab === "upload" && isOwner && <Upload statements={statements} onSaved={d => loadStatements(d)} />}
      </div>
      <div className="ver">{APP_VERSION}</div>
      <nav className="nav">
        <button className={tab === "tx" ? "on" : ""} onClick={() => setTab("tx")}>{Icon.list}明細</button>
        {isOwner && <button className={tab === "upload" ? "on" : ""} onClick={() => setTab("upload")}>{Icon.upload}取り込み</button>}
      </nav>
    </>
  );
}

function App() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  if (session === undefined) return null;
  return session ? <Main key={session.user.id} session={session} /> : <Login />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
